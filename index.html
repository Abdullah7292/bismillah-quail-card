<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিসমিল্লাহ কোয়েল এগ্রো ফার্ম এন্ড হ্যাচারি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0f5631; --wa:#26a63d; --fb:#1877f2;
    --mint:#e3f0e5; --mint-ic:#d6e8da; --fbbg:#dde9fd;
    --card:#ffffff; --ink:#1d2a22; --phone:#2a2f2b; --line:#e8ede6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  html{height:100%}
  body{min-height:100%;font-family:"Hind Siliguri",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(170deg,#e9f1e8,#dfeae0);
    display:flex;justify-content:center;align-items:flex-start;padding:20px 12px 34px;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--card:#152019;--ink:#eaf2ec;--line:#243029;--phone:#dfe9e1}
    :root:not([data-theme="light"]) body{background:linear-gradient(170deg,#0d1410,#121a14)}
  }
  :root[data-theme="dark"]{--card:#152019;--ink:#eaf2ec;--line:#243029;--phone:#dfe9e1}
  .card{width:100%;max-width:412px;background:var(--card);border-radius:26px;overflow:hidden;
    box-shadow:0 20px 55px rgba(15,55,30,.18);border:1px solid var(--line)}
  .hero{position:relative;line-height:0}
  .hero img{width:100%;display:block}
  .hero .maplink{position:absolute;left:18%;top:72%;width:64%;height:11%;display:block}
  .mid{background:var(--card);padding:14px 15px 4px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 7px 18px rgba(20,60,35,.07);padding:14px;margin-bottom:13px}
  .ptop{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:var(--mint-ic);display:grid;place-items:center}
  .avatar svg{width:30px;height:30px;fill:#2f7a4c}
  .nm{font-family:"Baloo Da 2",sans-serif;font-weight:700;font-size:19px;line-height:1.2;color:var(--ink)}
  .ph{font-size:18px;font-weight:600;color:var(--phone);letter-spacing:.5px;margin-top:2px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 6px;border-radius:12px;
    text-decoration:none;font-weight:700;font-size:15px;color:#fff;transition:transform .12s,filter .12s}
  .btn:active{transform:scale(.97)}
  @media(hover:hover){.btn:hover{filter:brightness(1.07)}}
  .btn svg{width:19px;height:19px;fill:#fff;flex:0 0 19px}
  .b-call{background:var(--green-deep)} .b-wa{background:var(--wa)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
  .flat{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 6px;border-radius:13px;
    text-decoration:none;font-weight:700;font-size:15.5px;transition:transform .12s,filter .12s}
  .flat:active{transform:scale(.98)}
  .flat svg{width:22px;height:22px;flex:0 0 22px}
  .f-mail{background:var(--mint);color:#14562e} .f-mail svg{fill:#14562e}
  .f-fb{background:var(--fbbg);color:var(--fb)} .f-fb svg{fill:var(--fb)}
  .feat{line-height:0} .feat img{width:100%;display:block}
</style>
</head>
