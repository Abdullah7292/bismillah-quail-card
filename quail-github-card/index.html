<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075c38" />
  <meta name="description" content="বিসমিল্লাহ কোয়েল এগ্রো ফার্ম এন্ড হ্যাচারি — যোগাযোগ ও সেবা" />
  <title>বিসমিল্লাহ কোয়েল এগ্রো ফার্ম এন্ড হ্যাচারি</title>
  <style>
    :root{
      --green:#075c38;
      --green2:#0b7a49;
      --wa:#18b756;
      --gold:#d7ad42;
      --cream:#fbfaf5;
      --ink:#172019;
      --muted:#6b756e;
      --line:#dfe8e2;
      --shadow:0 8px 28px rgba(7,92,56,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#eef3ef;color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Segoe UI",Arial,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:0}
    .page{width:min(100%,430px);min-height:100svh;background:var(--cream);overflow:hidden;position:relative}
    .hero{height:34svh;min-height:250px;max-height:310px;position:relative;background:url('assets/banner.jpg') center center/cover no-repeat}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,31,18,.04),rgba(2,31,18,.12) 55%,rgba(2,31,18,.52));}
    .heroText{position:absolute;z-index:2;left:22px;right:22px;bottom:26px;color:#fff;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.45)}
    .heroText h1{margin:0;font-size:clamp(23px,6vw,31px);line-height:1.12;font-weight:800;letter-spacing:-.3px}
    .heroText p{margin:8px 0 0;font-size:15px;font-weight:700}
    .wave{position:absolute;z-index:3;left:-2%;right:-2%;bottom:-1px;height:24px;background:var(--cream);border-radius:50% 50% 0 0/100% 100% 0 0}
    .content{padding:13px 16px calc(14px + env(safe-area-inset-bottom))}
    .contacts{display:grid;gap:10px}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .person{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .avatar{width:42px;height:42px;border-radius:50%;background:#eaf5ef;display:grid;place-items:center;color:var(--green);flex:0 0 auto}
    .avatar svg{width:24px;height:24px}
    .meta{min-width:0}
    .name{font-size:18px;line-height:1.15;font-weight:800;margin:0 0 3px}
    .phone{font-size:17px;font-weight:700;letter-spacing:.1px;color:#242a26}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .14s ease,filter .14s ease;-webkit-tap-highlight-color:transparent}
    .btn:active{transform:scale(.985);filter:brightness(.96)}
    .btn svg{width:20px;height:20px;fill:currentColor}
    .call{background:linear-gradient(135deg,#075c38,#0b7a49)}
    .wa{background:linear-gradient(135deg,#11a949,#1bc45c)}
    .common{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .mail{background:#fff;color:var(--green);border:1px solid #cfe2d7;box-shadow:none}
    .fb{background:#fff;color:#1265d8;border:1px solid #d5e3f7;box-shadow:none}
    .serviceStrip{margin-top:11px;background:linear-gradient(180deg,#0b6840,#064f31);color:#fff;border-radius:18px;padding:12px 9px 11px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:var(--shadow)}
    .service{text-align:center;font-size:11.5px;line-height:1.28;font-weight:700;padding:0 3px}
    .serviceIcon{width:34px;height:34px;border-radius:50%;background:#f5f2de;color:var(--green);display:grid;place-items:center;margin:0 auto 5px}
    .serviceIcon svg{width:20px;height:20px;fill:currentColor}
    .footer{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
    @media (max-height:720px){
      .hero{height:29svh;min-height:205px}
      .heroText{bottom:19px}
      .heroText h1{font-size:23px}
      .content{padding-top:10px}
      .card{padding:10px}
      .person{margin-bottom:8px}
      .avatar{width:38px;height:38px}
      .name{font-size:16px}.phone{font-size:15px}
      .btn{height:40px;font-size:14px}
      .serviceStrip{padding:9px 6px}
      .service{font-size:10.5px}
      .serviceIcon{width:30px;height:30px}
    }
    @media (min-width:700px){body{padding:24px}.page{min-height:auto;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.16)}}
  </style>
</head>
<body>

      <div class="heroText">

        <p>📍 মাওয়া, মুন্সিগঞ্জ, ঢাকা</p>

      <div class="wave" aria-hidden="true"></div>

        </article>

        <article class="card">

            </a>
            <a class="btn wa" href="https://wa.me/8801806841216" target="_blank" rel="noopener" aria-label="আবু সাঈদের WhatsApp">

            </a>
          </div>
        </article>
      </div>

      <div class="common">
        <a class="btn mail" href="mailto:mosarrof847@gmail.com" aria-label="ইমেইল করুন">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>Email

        <div class="service"><div class="serviceIcon"><svg viewBox="0 0 24 24"><path d="M3 9h18l-2-5H5L3 9Zm1 2v9h16v-9h-2v7h-4v-5H10v5H6v-7H4Z"/></svg></div>পাইকারি ও<br>খুচরা বিক্রয়</div>
      </section>
      <p class="footer">বিসমিল্লাহ কোয়েল এগ্রো ফার্ম এন্ড হ্যাচারি</p>
    </section>
  </main>
</body>
</html>
